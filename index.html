<title>Look Again</title>

<style>
/* One black screen. At rest: the work and its name. Tap: the work steps back but stays the focal point, with one small neighbour and a half on each side. */
:root {
  color-scheme: dark;
  --bg: #000;
  --fg: #f4f4f2;
  --dim: #8d8d89;
  --hair: #3a3a38;
  --solid: rgba(14, 14, 14, .95);
  --kids: #f6c21c;
  --experts: #4fb4e6;
  --extra: #ff6a55;
  --sans: "Assistant", "Heebo", system-ui, sans-serif;
  --d: 50vw;
  --step: 90px;
  --s: .62;
  --ease: cubic-bezier(.3,.7,.2,1);
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.screen { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; position: relative; padding-block: calc(54px + env(safe-area-inset-top, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
.stage { height: min(calc(100vw - 16px), 54vh, 544px); position: relative; overflow: hidden; }
/* Placed from the stage's centre, so the canvas's pixel size can never push it sideways. */
#work { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(calc(100% - 16px), 54vh); aspect-ratio: 1; max-width: 100%; border-radius: 50%; z-index: 2; touch-action: pan-y; transition: transform .6s var(--ease); }
#work canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
body.browse #work { transform: translate(-50%, -50%) scale(var(--s)); pointer-events: none; }

/* The line of works. Invisible slots give native scrolling and snapping; the circles you see are drawn from the scroll position. */
#track { position: absolute; inset: 0; display: flex; overflow-x: auto; scrollbar-width: none; padding-inline: calc(50% - var(--step) / 2); scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; pointer-events: none; }
#track::-webkit-scrollbar { display: none; }
body.browse #track { pointer-events: auto; }
.slot { flex: none; width: var(--step); height: 100%; scroll-snap-align: center; }
#orbs { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s; }
body.browse #orbs { opacity: 1; }

.orb { position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); border-radius: 50%; overflow: hidden; background: #1a1a1a; will-change: transform, opacity; }
.orb img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* The header: gallery, the exhibition, settings. The work's own name sits with the image and follows it. */
.head { flex: none; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 4px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
#exhibition { text-align: center; font-size: 15px; font-weight: 600; color: var(--dim); min-width: 0; text-wrap: balance; }
.mid { flex: none; }
.plaque { text-align: center; min-height: 76px; display: flex; flex-direction: column; justify-content: flex-end; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: transform .6s var(--ease); }
body.browse .plaque { transform: translateY(var(--drop, 0px)); }
#title, #meta { transition: opacity .22s ease, transform .32s var(--ease); }
.plaque.swap #title, .plaque.swap #meta { opacity: 0; transform: translateY(5px); }
#title { font-size: 21px; line-height: 1.2; font-weight: 600; text-wrap: balance; }
#meta { font-size: 15px; line-height: 1.35; color: var(--dim); margin-top: 2px; }

.below { flex: none; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
body.browse .below { opacity: 1; pointer-events: auto; }
.controls { display: grid; grid-template-columns: 56px 60px 56px; justify-content: center; align-items: center; gap: 36px; padding-block: 6px; }
.arrow { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; }
.arrow svg { width: 32px; height: 32px; fill: none; stroke: var(--fg); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.arrow:disabled svg { stroke: var(--hair); }
.arrow:disabled { cursor: default; }
.play { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--dim); }
.play svg { width: 26px; height: 26px; fill: var(--fg); }

.tool { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; opacity: 0; pointer-events: none; transition: opacity .35s; }
body.browse .tool { opacity: 1; pointer-events: auto; }
.tool svg { width: 24px; height: 24px; }
#openRooms svg { fill: var(--fg); }
#openSettings svg { fill: none; stroke: var(--fg); stroke-width: 1.6; stroke-linecap: round; }

/* Gallery and settings are full screens over the work. */
.panel { position: fixed; inset: 0; z-index: 5; max-width: 560px; margin-inline: auto; background: var(--solid); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); display: flex; flex-direction: column; padding-top: calc(60px + env(safe-area-inset-top, 0px)); opacity: 0; transform: translateY(16px); visibility: hidden; transition: opacity .3s, transform .4s var(--ease), visibility 0s .4s; }
.panel.on { opacity: 1; transform: none; visibility: visible; transition: opacity .3s, transform .4s var(--ease); }
.panel h1 { flex: none; font-size: 28px; line-height: 1.15; font-weight: 600; margin: 0; padding-block: 4px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 0 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#roomList h2 { font-size: 15px; font-weight: 600; color: var(--dim); margin: 22px 0 12px; padding-top: 14px; border-top: 1px solid var(--hair); }
#roomList h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; font-size: 13px; line-height: 1.2; color: var(--fg); }
.cell img { width: 100%; max-width: 104px; aspect-ratio: 1; border-radius: 50%; object-fit: cover; background: #1a1a1a; opacity: .8; }
.cell[aria-current="true"] img { opacity: 1; outline: 2px solid var(--fg); outline-offset: 3px; }
.x { position: absolute; top: calc(52px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); z-index: 2; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; }
.x svg { width: 24px; height: 24px; fill: none; stroke: var(--fg); stroke-width: 1.8; stroke-linecap: round; }

/* All exhibitions: the first screen, and where the gallery's back button leads. */
.back { flex: none; align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 8px; margin-left: max(16px, env(safe-area-inset-left, 0px)); }
.back svg { width: 18px; height: 18px; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#home { background: var(--bg); z-index: 6; }
#brand { flex: none; align-self: flex-start; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 0 0 18px max(16px, env(safe-area-inset-left, 0px)); transform-origin: center; transition: transform 1s var(--ease); }
#brand small { font-size: 12px; color: var(--dim); }
#brand img { display: block; height: 66px; width: auto; max-width: calc(100vw - 32px); margin-left: -2px; filter: invert(1); }
#home h1 { font-size: 24px; padding-bottom: 12px; text-wrap: balance; transition: opacity .6s .55s; }
#exList { padding-bottom: 28px; }
body.intro #brand { transform: translate(var(--riseX, 0px), var(--rise, 0px)) scale(1.2); transition: none; }
body.intro #home h1 { opacity: 0; }
body.intro #home h1 { transition: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
body.intro-rows .ex { animation: rowIn .6s var(--ease) both; animation-delay: calc(1.75s + var(--n) * 60ms); }
.ex { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 14px; width: 100%; text-align: left; padding-block: 8px; }
.ex img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; background: #1a1a1a; }
.ex span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ex b { font-size: 18px; line-height: 1.22; font-weight: 600; color: var(--fg); text-wrap: balance; }
.ex small { font-size: 14px; color: var(--dim); }
.ex:disabled { cursor: default; }
.ex:disabled img { opacity: .7; }
.ex:disabled b { font-weight: 400; color: #c9c9c5; }

/* Settings */
.group { padding-block: 10px 30px; }
.group h2 { font-size: 15px; font-weight: 600; color: var(--dim); margin: 0 0 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 42px; padding-inline: 16px; border-radius: 21px; font-size: 16px; color: var(--dim); background: #1e1e1d; transition: background .18s, color .18s; }
.pill[aria-pressed="true"] { background: var(--fg); color: #000; font-weight: 600; }
.flavour { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--tone, var(--fg)); }
.flavour[aria-pressed="true"] { background: var(--tone, var(--fg)); color: #000; }
.pill:disabled { cursor: default; opacity: .5; }

/* The scale: a line of dots that grow toward "fully detailed", echoing the edge of the image. */
#scaleName { font-size: 34px; line-height: 1.1; font-weight: 600; margin: 0 0 12px; }
.scale { position: relative; height: 44px; }
.scale .dots { position: absolute; inset: 0; padding-inline: 15px; display: flex; align-items: center; justify-content: space-between; }
.scale .dots i { display: block; border-radius: 50%; background: #3a3a38; }
.scale .dots i.lit { background: var(--fg); }
#scale { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; touch-action: pan-y; cursor: pointer; }
#scale::-webkit-slider-runnable-track { background: transparent; height: 44px; }
#scale::-moz-range-track { background: transparent; }
#scale::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: 7px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 5px #0e0e0e; }
#scale::-moz-range-thumb { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 5px #0e0e0e; }
.ends { display: flex; justify-content: space-between; font-size: 14px; color: var(--dim); margin-top: 2px; }

.tone-kids { --tone: var(--kids); }
.tone-experts { --tone: var(--experts); }
.tone-extra { --tone: var(--extra); }
#resetFlavours { margin-top: 16px; min-height: 40px; font-size: 15px; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }

@media (prefers-reduced-motion: reduce) { #work, #orbs, .tool, .orb, .plaque, .below, .panel, .panel.on, .pill, #brand, #home h1, #title, #meta { transition: none; }
  body.intro-rows .ex { animation: none; } }
</style>

<script src="guide-v4.js"></script>
<main class="screen">
  <header class="head">

<script>
// Every work on the route, room by room, following the floor map and the book.
const ROOMS = [
  [["Peace","2019","entrance"],["Pointed Sense","2010","pointed"],["Portrait wall","","portraits"],["Love Drug","2013","heartfull"],["Look Out","2013","lookout"]],
  [["See Film Differently","2013","film"],["The Handmaid's Tale","2017","handmaid"],["Stalking","2010","stalking"],["Which Came First?","2013","whichcame"],["Facing Up","2013","facingup"],["S.M.L","2009","sml"],["Peace","2014","peace"],["Night Train to London","2010","nighttrain"],["Who's Looking at You in 2020?","2019","eye"],["How I Got Through It","","howigot"],["Double Bill","2013","doublebill"],["Shy Guy","2009","shyguy"],["Beware of the Wolves","2008","wolves"],["Vocal Fry","","vocalfry"]],
  [["Transitions","2022","rabbit"],["This Column Will Change Your Life","2009–2011","faces"],["Optimistic and Pessimistic","2018","optimistic"],["See Things Differently","2014","seethingsround"],["What You See / What You Get","2010","whatyousee"],["Zero K","2017","zerok"],["Time to Change","2024","timetochange"]],
  [["Evolutionary Thought 2","2013","bigdog"]],
  [["Tel Aviv Summer","2026","summer"],["V&A","2009–2011","vanda"],["Coca-Cola","2016–2019","coke"],["Unmasking a Killer","2016","unmaskingbook"]],
  [["Book of Opposites","2026","opposites"],["De Ontmoeting","Since 2003","grid"],["Haruki Murakami","2012","murakami"],["The Great Indoors","","squares"]],
  [["Film and early work","","early"]]
];
const WORKS = ROOMS.flat().map(([title, year, img]) => ({ title, year, img }));

// From the museum's What's On page.
const EXHIBITIONS = [
  ["Noma Bar: Look Again", "Until 16/1/27", "noma", true],
  ["Alex Levac: Black Box", "Until 1/5/27", "levac"],
  ["Tom Wesselmann: All Out", "Until 26/12/26", "wesselmann"],
  ["Vision of the New Bones: Jewish Imaginations after 1940", "Until 16/1/27", "newbones"],
  ["Ilana Dotan: Shelf Life", "Until 28/11/26", "dotan"],
  ["Beyond Small: Miniature Worlds in Contemporary Art", "Until 12/12/26", "beyondsmall"],
  ["Playing with Scale", "Until 9/1/27", "playing"],
  ["Dmitri Cherniak: Ringers in Motion", "Until 5/12/26", "cherniak"],
  ["Simply Draw at the Museum", "Until 30/4/27", "simplydraw"],
  ["Year Zero", "Until 7/11/26", "yearzero"],
  ["Miriam Cahn: Dream Command", "Opens 14/12/26", "cahn"]
];

// Where the circle looks in photos whose work is off-centre: centre x, centre y, width of the crop, in image pixels.
const FOCUS = { entrance: [640, 370, 720], eye: [265, 258, 500] };

const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2;

let W = 0, dots = [], cell = 0;
let square = document.createElement("canvas");
let current = 0, wanted = 0;
let presence = 0, leaving = false;   // how much of the work has gathered on screen, 0 to 1
let paused = true, clock = 0, voice = 0, last = 0;
let rate = 1, veil = 1, spread = 0, T = 0, blinkAt = -9;
let morph = null, morphDir = 1, morphToken = 0, slide = null, ignoreScrollUntil = 0;
const oldSquare = document.createElement("canvas"), layerA = document.createElement("canvas"), layerB = document.createElement("canvas");
const images = {};

function load(name) {
  return images[name] ||= new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null);
    im.src = `img/${name}.jpg`;
  });
}

function crop(im) {
  square.width = square.height = W;
  const g = square.getContext("2d");
  g.fillStyle = "#111"; g.fillRect(0, 0, W, W);
  if (!im) return;
  const iw = im.naturalWidth, ih = im.naturalHeight;
  const [cx, cy, want] = FOCUS[WORKS[current].img] || [iw / 2, ih / 2, Math.min(iw, ih)];
  const side = Math.min(want, iw, ih);
  const sx = Math.max(0, Math.min(iw - side, cx - side / 2));
  const sy = Math.max(0, Math.min(ih - side, cy - side / 2));
  g.drawImage(im, sx, sy, side, side, 0, 0, W, W);
}

// A honeycomb of dots over the whole circle. At rest only the edge ones show; in a fade they carry the entire image.
function layout() {
  const size = canvas.clientWidth;
  if (!size) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const next = Math.round(size * dpr);
  if (next === W) return;
  W = canvas.width = canvas.height = next;
  for (const c of [oldSquare, layerA, layerB]) c.width = c.height = W;
  cell = W / 54;
  dots = [];
  const c = W / 2, rowH = cell * Math.sqrt(3) / 2;
  for (let row = -40, y; (y = c + row * rowH) < W + cell; row++) {
    if (y < -cell) continue;
    for (let col = -40, x; (x = c + col * cell + (row & 1 ? cell / 2 : 0)) < W + cell; col++) {
      if (x < -cell) continue;
      const r = Math.hypot(x - c, y - c);
      if (r < W * .5) dots.push({ x, y, r, a: Math.atan2(y - c, x - c) });
    }
  }
  load(WORKS[current].img).then(crop);
}

// The edge: broad, slow swells, so the circle breathes and never looks lumpy.
function edge(a, t, swell) {
  return W * (
    .0070 * Math.sin(2 * a + t * .31) +
    .0050 * Math.sin(3 * a - t * .23 + 1.3) +
    .0028 * Math.sin(5 * a + t * .41 + 4.1)
  ) * (.7 + .5 * swell);
}

const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = v => v * v * (3 - 2 * v);

// Paints one image through the dots. amount(dot) says how far each dot has grown, 0 to 1.
function paint(g, img, t, base, band, amount, solid) {
  const c = W / 2;
  g.globalCompositeOperation = "source-over";
  g.clearRect(0, 0, W, W);
  g.beginPath();
  if (solid) {
    const steps = 96;
    for (let i = 0; i <= steps; i++) {
      const a = i / steps * TAU - Math.PI;
      const r = base - band * 1.1 + edge(a, t, voice) * .7;
      const x = c + Math.cos(a) * r, y = c + Math.sin(a) * r;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  }
  // Dots grow toward the centre and shrink to nothing outward; a slow ripple runs across them.
  const full = cell * .72;
  const covered = solid ? base - band * 1.1 - W * .03 - cell : -1;
  for (const d of dots) {
    if (d.r < covered) continue;
    const u = (d.r - (base - band * .7 + edge(d.a, t, voice))) / (band * 1.7);
    if (u >= 1) continue;
    const fade = u <= 0 ? 1 : Math.pow(1 - u, 1.35);
    const ripple = 1 + .3 * clamp01((u + .35) * 2) * Math.sin((d.x + d.y * .6) / W * 15 - t * 1.05) * Math.sin(d.a * 4 + t * .33);
    const s = full * fade * ripple * amount(d);
    if (s < .35) continue;
    g.moveTo(d.x + s, d.y);
    g.arc(d.x, d.y, s, 0, TAU);
  }
  g.fill();
  g.globalCompositeOperation = "source-in";
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = "source-over";
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min((now - last) / 1000 || 0, .1));
  last = now;
  T = now / 1000;
  if (!W || document.hidden) return;

  // Pausing eases the movement down rather than stopping it dead.
  rate += ((paused ? .12 : 1) - rate) * Math.min(1, dt * 3);
  clock += dt * rate;

  // The edge swells while the guide is speaking and settles in the silences, from the sentence timings.
  const speaking = isSpeaking() ? .55 + .45 * Math.abs(Math.sin(clock * 2.3) * Math.sin(clock * 1.1)) : 0;
  followAudio();
  voice += (speaking - voice) * Math.min(1, dt * 1.6);

  // Dragging the line: the live image dissolves, and gathers again where the line stops.
  if (leaving) {
    presence = Math.max(0, presence - dt / .34);
    if (presence === 0 && current !== wanted) swap();
  } else if (presence < 1) {
    presence = Math.min(1, presence + dt / 1.05);
  }
  const p = smooth(presence);

  renderOrbs(dt);

  const t = still ? 0 : clock;
  const breath = Math.sin(t * TAU / 7);
  const base = W * (.385 + .006 * breath + .009 * voice);
  const band = W * (.078 + .01 * voice);

  if (morph !== null) {
    // The change of work: a soft wave sweeps across in the direction of travel; old dots shrink as new dots grow on the same grid.
    morph = Math.min(1, morph + dt / (still ? .01 : 1.15));
    const m = smooth(morph), w = .6, sweep = morphDir > 0 ? 1 : -1;
    const k = d => {
      const q = (sweep > 0 ? 1 - d.x / W : d.x / W) + .05 * Math.sin(d.y / W * 19 + d.x / W * 7);
      return smooth(clamp01((m * (1 + w + .1) - q) / w));
    };
    paint(layerA.getContext("2d"), oldSquare, t, base, band, d => 1 - k(d), false);
    paint(layerB.getContext("2d"), square, t, base, band, k, false);
    ctx.clearRect(0, 0, W, W);
    ctx.drawImage(layerA, 0, 0);
    ctx.drawImage(layerB, 0, 0);
    if (morph >= 1) morph = null;
    return;
  }
  // The image gathers from the middle outward and leaves from the edge inward, always as one surface.
  const amount = d => smooth(clamp01(p * 1.5 - d.r / (W / 2) * .5));
  paint(ctx, square, t, base, band, amount, p >= .9);
}

async function swap() {
  current = wanted;
  const im = await load(WORKS[current].img);
  crop(im);
  leaving = false;
  load(WORKS[Math.min(current + 1, WORKS.length - 1)].img);
}

async function startMorph() {
  const token = ++morphToken;
  oldSquare.getContext("2d").drawImage(square, 0, 0);
  current = wanted;
  const im = await load(WORKS[current].img);
  if (token !== morphToken) return;
  crop(im);
  morph = 0;
  load(WORKS[Math.min(current + 1, WORKS.length - 1)].img);
  load(WORKS[Math.max(current - 1, 0)].img);
}

function trackAt() {
  if (slide) {
    const k = clamp01((T - slide.t0) / slide.dur);
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    if (k >= 1) slide = null;
    else return slide.from + (slide.to - slide.from) * e;
  }
  return $("track").scrollLeft / (G.step || 90);
}

function show(i, instant, dragged) {
  const from = trackAt();
  morphDir = i >= wanted ? 1 : -1;
  wanted = i;
  $("prev").disabled = i === 0;
  $("next").disabled = i === WORKS.length - 1;
  document.querySelectorAll("[data-work]").forEach(b => b.setAttribute("aria-current", +b.dataset.work === i ? "true" : "false"));
  if (instant) { plaque(i); centreTrack(); return; }
  swapPlaque(i);
  blink();
  centreTrack();
  if (dragged) { leaving = true; return; }
  if (!still) slide = { from, to: i, t0: T, dur: .8 };
  if (presence >= .9 && !leaving) startMorph();
  else leaving = true;
}

function blink() { blinkAt = T; }

let plaqueTimer;
function swapPlaque(i) {
  const box = document.querySelector(".plaque");
  box.classList.add("swap");
  clearTimeout(plaqueTimer);
  plaqueTimer = setTimeout(() => { plaque(i); box.classList.remove("swap"); }, still ? 0 : 200);
}

function plaque(i) {
  const w = WORKS[i];
  if ("mediaSession" in navigator && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title: w.title, artist: "Noma Bar", album: "Look Again" });
  $("title").textContent = w.title;
  $("meta").textContent = w.year ? `Noma Bar, ${w.year}` : "Noma Bar";
}

function trackTarget(i) {
  const track = $("track"), b = track.children[i];
  return b ? b.offsetLeft - track.clientWidth / 2 + b.offsetWidth / 2 : 0;
}

function centreTrack() {
  ignoreScrollUntil = performance.now() + 250;
  $("track").scrollTo({ left: trackTarget(wanted), behavior: "auto" });
}

function go(i) { if (i >= 0 && i < WORKS.length && i !== wanted) { show(i); seekTo(i); } }

function togglePause() {
  setPaused(!paused);
}

function setPaused(next) {
  paused = next;
  if (paused) player.pause(); else playNow();
  const label = paused ? "Play" : "Pause";
  $("play").setAttribute("aria-label", label);
  $("iconPause").style.display = paused ? "none" : "";
  $("iconPlay").style.display = paused ? "" : "none";
}

const THUMB_AIM = { entrance: "70% 50%", eye: "10% 50%" };
function picture(w) {
  const im = document.createElement("img");
  im.src = `img/${w.img}.jpg`; im.alt = "";
  if (THUMB_AIM[w.img]) im.style.objectPosition = THUMB_AIM[w.img];
  return im;
}

const orbs = WORKS.map(w => {
  const o = document.createElement("div");
  o.className = "orb";
  o.append(picture(w));
  $("orbs").append(o);
  return o;
});

function choose(i) {
  if (i === wanted || i === null) browse(false);
  else { go(i); hideSoon(); }
}

WORKS.forEach((w, i) => {
  const b = document.createElement("button");
  b.className = "slot"; b.type = "button"; b.dataset.work = i;
  b.setAttribute("aria-label", `${i + 1} of ${WORKS.length}: ${w.title}`);
  b.onclick = e => {
    e.stopPropagation();
    choose(e.detail === 0 ? i : hit(e.clientX));
  };
  $("track").append(b);
});

// Geometry of the line: the current work is just over half the width, dotted edge included; one small neighbour and a half on each side.
const G = { D: 0, n: 0, near: 0, far: 0, step: 90 };
function fit() {
  const w = $("stage").clientWidth, gap = 10;
  if (!w) return;
  G.D = Math.round(w * .54);
  G.n = (w - G.D - gap * 4) / 3;
  G.near = G.D / 2 + gap + G.n / 2;
  G.far = G.n + gap;
  const root = document.documentElement.style;
  root.setProperty("--d", G.D + "px");
  root.setProperty("--step", G.step + "px");
  const size = $("work").clientWidth;
  if (size) root.setProperty("--s", (G.D / (size * .92)).toFixed(3));
  // When the image steps back, its name moves down with it.
  root.setProperty("--drop", Math.max(0, ($("stage").clientHeight - G.D) / 2 - 12) + "px");
}
function place(d) {
  const a = Math.abs(d), x = a <= 1 ? a * G.near : G.near + (a - 1) * G.far;
  const k = Math.min(a, 1), ease = k * k * (3 - 2 * k);
  return { x: d < 0 ? -x : x, size: G.D + (G.n - G.D) * ease, fade: 1 - .4 * ease, a };
}
function renderOrbs(dt) {
  if (!G.D) return;
  const browsing = document.body.classList.contains("browse");
  const moving = document.body.classList.contains("moving");
  // The circle shows while the live image is away, and melts away as its dots gather.
  veil += ((moving || presence < .7 ? 1 : 0) - veil) * Math.min(1, dt * (moving ? 12 : 5));
  spread += ((browsing ? 1 : 0) - spread) * Math.min(1, dt * 6);
  const at = trackAt(), spreadK = .5 + .5 * smooth(clamp01(spread));
  const since = T - blinkAt;
  orbs.forEach((o, i) => {
    const { x, size, fade, a } = place(i - at);
    if (a > 3.5) { if (o.style.display !== "none") o.style.display = "none"; return; }
    if (o.style.display === "none") o.style.display = "";
    o.style.transform = `translateX(${(x * spreadK).toFixed(1)}px) scale(${(size / G.D).toFixed(3)})`;
    // Under the live image the middle circle is hidden; it appears as it slides out from behind.
    const under = Math.max(veil, smooth(clamp01((a - .62) / .3)));
    // The blink runs outward from the middle, one circle after another.
    const b = still ? 0 : clamp01((since - a * .07) / .6);
    const pulse = b > 0 && b < 1 ? 1 - .6 * Math.sin(Math.PI * b) : 1;
    o.style.opacity = (fade * under * pulse).toFixed(3);
  });
}
// Which circle a tap landed on; null if it landed on the black.
function hit(clientX) {
  const box = $("stage").getBoundingClientRect(), tap = clientX - box.left - box.width / 2;
  const at = trackAt();
  for (let i = 0; i < WORKS.length; i++) {
    const { x, size, a } = place(i - at);
    if (a <= 3 && Math.abs(tap - x) <= Math.max(size / 2, 22)) return i;
  }
  return null;
}

// The menu: every work under its room.
let n = 0;
for (const [r, works] of ROOMS.entries()) {
  const h = document.createElement("h2"); h.textContent = `Room ${r + 1}`;
  const cells = document.createElement("div"); cells.className = "cells";
  for (let k = 0; k < works.length; k++, n++) {
    const i = n, b = document.createElement("button");
    b.className = "cell"; b.type = "button"; b.dataset.work = i;
    const name = document.createElement("span"); name.textContent = WORKS[i].title;
    b.append(picture(WORKS[i]), name);
    b.onclick = () => { go(i); panel(null); browse(false); };
    cells.append(b);
  }
  $("roomList").append(h, cells);
}

let openPanel = null;
EXHIBITIONS.forEach(([name, when, pic, open]) => {
  const b = document.createElement("button");
  b.className = "ex"; b.type = "button"; b.disabled = !open;
  const im = document.createElement("img"); im.src = `img/ex-${pic}.jpg`; im.alt = "";
  const txt = document.createElement("span");
  const t = document.createElement("b"); t.textContent = name;
  const d = document.createElement("small"); d.textContent = when;
  txt.append(t, d);
  b.append(im, txt);
  b.style.setProperty("--n", Math.min($("exList").children.length, 7));
  if (open) b.onclick = enterTour;
  $("exList").append(b);
});
function enterTour() {
  $("closeHome").hidden = false;   // From now on there is a tour to go back to.
  panel(null);
  presence = 0; leaving = false; morph = null;
  browse(true);
  setPaused(false);
}

// The logo opens up into the menu: it starts large in the middle, rises to the top, and the list follows.
function openingLogo() {
  const box = $("brand").getBoundingClientRect();
  const y = innerHeight / 2 - (box.top + box.height / 2);
  if (still || !box.height) return;
  document.documentElement.style.setProperty("--rise", y + "px");
  document.documentElement.style.setProperty("--riseX", (innerWidth / 2 - (box.left + box.width / 2)) + "px");
  document.body.classList.add("intro", "intro-rows");
  setTimeout(() => document.body.classList.remove("intro"), 1100);
  setTimeout(() => document.body.classList.remove("intro-rows"), 3600);
}

function panel(id) {
  openPanel = id;
  document.querySelectorAll(".panel").forEach(el => {
    const on = el.id === id;
    el.classList.toggle("on", on);
    el.inert = !on;
  });
  clearTimeout(hideTimer);
  if (id === "rooms") {
    const now = $("roomList").querySelector('[aria-current="true"]');
    if (now) $("roomList").scrollTop = Math.max(0, now.offsetTop - $("roomList").offsetTop - 120);
  }
  if (!id) hideSoon();
}

// Settings. A mock-up: choices are remembered on the page but do not change the tour yet.
const SCALE = ["A taste", "Short", "Sweet spot", "Longer", "Fully detailed"];
const DOT_COUNT = 23;
for (let i = 0; i < DOT_COUNT; i++) {
  const d = document.createElement("i"), size = 3 + 11 * i / (DOT_COUNT - 1);
  d.style.width = d.style.height = size.toFixed(1) + "px";
  $("scaleDots").append(d);
}
function setScale() {
  const v = +$("scale").value;
  $("scaleName").textContent = SCALE[v];
  $("scale").setAttribute("aria-valuetext", SCALE[v]);
  [...$("scaleDots").children].forEach((d, i) => d.classList.toggle("lit", i / (DOT_COUNT - 1) <= v / 4));
}
$("scale").addEventListener("input", () => { setScale(); useTrack(+$("scale").value < 2 ? "short" : "sweet"); });
setScale();

// All in one mix. Editor's notes starts on; the stroke colour says who else each one is for.
const FLAVOURS = [
  ["Editor's notes", "", true],
  ["Little riddles", "tone-kids"],
  ["Other works of art", "tone-experts"],
  ["Historical facts", "tone-extra"],
  ["Interesting anecdotes", "tone-kids"],
  ["References", "tone-experts"],
  ["Get to know the world", "tone-kids"],
  ["Techniques", "tone-experts"],
  ["Inspirations", "tone-experts"]
];
FLAVOURS.forEach(([name, tone, on]) => {
  const b = document.createElement("button");
  b.className = "pill flavour" + (tone ? " " + tone : ""); b.type = "button"; b.textContent = name;
  b.setAttribute("aria-pressed", !!on);
  b.dataset.default = !!on;
  b.onclick = () => { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); flavourState(); };
  $("flavours").append(b);
});
function flavourState() {
  $("resetFlavours").hidden = [...document.querySelectorAll(".flavour")].every(b => b.getAttribute("aria-pressed") === b.dataset.default);
}
$("resetFlavours").onclick = () => {
  document.querySelectorAll(".flavour").forEach(b => b.setAttribute("aria-pressed", b.dataset.default));
  flavourState();
};

let hideTimer;
function hideSoon() {
  clearTimeout(hideTimer);
  if (!paused && !openPanel) hideTimer = setTimeout(() => browse(false), 6000);
}
function browse(on) {
  document.body.classList.toggle("browse", on);
  $("work").setAttribute("aria-label", on ? "The work you are listening to" : "Show controls");
  clearTimeout(hideTimer);
  if (on) { fit(); centreTrack(); hideSoon(); }
}

$("play").onclick = () => { togglePause(); hideSoon(); };
$("prev").onclick = () => { go(wanted - 1); hideSoon(); };
$("next").onclick = () => { go(wanted + 1); hideSoon(); };
$("openRooms").onclick = () => panel("rooms");
$("openSettings").onclick = () => panel("settings");
$("toHome").onclick = () => { browse(false); setPaused(true); panel("home"); };
$("closeHome").onclick = enterTour;
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => panel(null));

// Tap anywhere: the work steps back into the line, or comes forward again.
document.querySelector(".screen").addEventListener("click", e => {
  if (e.target.closest("#below button, .tool, .panel")) return;
  browse(!document.body.classList.contains("browse"));
});

// At rest, a sideways swipe moves to the next work without showing anything else.
let x0 = null, y0 = null;
$("stage").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
$("stage").addEventListener("touchend", e => {
  if (x0 === null || document.body.classList.contains("browse")) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) go(wanted + (dx < 0 ? 1 : -1));
}, { passive: true });

function nearest() {
  const track = $("track"), mid = track.scrollLeft + track.clientWidth / 2;
  let best = 0, gap = Infinity;
  [...track.children].forEach((b, i) => {
    const d = Math.abs(b.offsetLeft + b.offsetWidth / 2 - mid);
    if (d < gap) { gap = d; best = i; }
  });
  return best;
}

// While the line moves, the live image dissolves and the name follows the middle. Where it stops is the work you hear next.
let settle;
$("track").addEventListener("scroll", () => {
  if (!document.body.classList.contains("browse") || performance.now() < ignoreScrollUntil) return;
  slide = null;
  const track = $("track"), here = nearest();
  plaque(here);
  if (Math.abs(track.scrollLeft - trackTarget(wanted)) > track.children[0].offsetWidth * .2) {
    if (!document.body.classList.contains("moving")) blink();
    document.body.classList.add("moving");
    leaving = true;
  }
  hideSoon();
  clearTimeout(settle);
  settle = setTimeout(() => {
    const stop = nearest();
    document.body.classList.remove("moving");
    if (stop !== wanted) { show(stop, false, true); seekTo(stop); } else { leaving = false; plaque(stop); }
  }, 180);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(wanted + 1);
  if (e.key === "ArrowLeft") go(wanted - 1);
  if (e.key === "Escape") { if (openPanel) panel(null); else browse(false); }
});

addEventListener("resize", () => { layout(); fit(); centreTrack(); });
if (window.ResizeObserver) new ResizeObserver(layout).observe($("work"));
// The narration. One continuous recording per length, with timings for each work and sentence,
// held in memory so it keeps playing with no reception and with the phone locked.
const TOUR = window.TOUR || { sweet: { stops: [] }, short: { stops: [] } };
const player = new Audio();
player.preload = "auto";
const tracks = {}, trackUrl = {};
let trackName = "sweet", pendingSeek = null;

function fetchTrack(name) {
  return tracks[name] ||= fetch(`track-${name}.mp4`).then(r => r.blob()).then(b => {
    trackUrl[name] = URL.createObjectURL(new Blob([b], { type: "audio/mp4" }));
    return trackUrl[name];
  });
}
function stopsNow() { return TOUR[trackName].stops; }

// Phones only allow sound to start inside a tap, so the recording is loaded in advance and started directly.
function playNow() {
  const url = trackUrl[trackName];
  if (!url) { fetchTrack(trackName).then(() => { if (!paused) playNow(); }); return; }
  if (player.src !== url) { player.src = url; pendingSeek = wanted; }
  player.play().catch(() => setPaused(true));
}
function applySeek(i) {
  const s = stopsNow()[i];
  if (s) { player.currentTime = s.start; ignoreFollowUntil = performance.now() + 400; }
}
player.addEventListener("loadedmetadata", () => { if (pendingSeek !== null) { applySeek(pendingSeek); pendingSeek = null; } });
function seekTo(i) {
  if (!player.src) return;
  if (player.readyState >= 1) applySeek(i); else pendingSeek = i;
}
let ignoreFollowUntil = 0;
function followAudio() {
  if (paused || !player.src || player.readyState < 1 || pendingSeek !== null || performance.now() < ignoreFollowUntil) return;
  const list = stopsNow(), t = player.currentTime;
  let i = 0;
  while (i + 1 < list.length && list[i + 1].start <= t) i++;
  if (i !== wanted && document.body.classList.contains("moving") === false) show(i);
}
function isSpeaking() {
  if (paused || !player.src) return false;
  const s = stopsNow()[wanted], t = player.currentTime;
  return !!s && s.lines.some(([a, b]) => t >= a && t <= b);
}
function useTrack(name) {
  if (name === trackName) return;
  trackName = name;
  if (!paused) playNow();
  else if (player.src) { player.pause(); player.removeAttribute("src"); player.load(); }
}
player.addEventListener("ended", () => setPaused(true));
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", () => setPaused(false));
  ms.setActionHandler("pause", () => setPaused(true));
  ms.setActionHandler("nexttrack", () => go(wanted + 1));
  ms.setActionHandler("previoustrack", () => go(wanted - 1));
}
const noteEl = () => document.querySelector(".ex small");
const noteText = EXHIBITIONS[0][1];
noteEl().textContent = "Getting the tour ready…";
fetchTrack("sweet").then(() => { noteEl().textContent = noteText; fetchTrack("short"); }).catch(() => { noteEl().textContent = noteText; });

fit();
show(0, true);
layout();
panel("home");
openingLogo();
requestAnimationFrame(frame);
</script>

<script>
if ("serviceWorker" in navigator) {
  const hadOld = !!navigator.serviceWorker.controller;
  // A new version of the tour: refresh once, unless someone is already listening.
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadOld && paused) location.reload(); });
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
